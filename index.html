<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Impostore</title>
<meta name="description" content="Il gioco dell'impostore da 4 a 10 giocatori, con parola indizio per l'impostore.">
<meta name="theme-color" content="#16111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impostore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
@font-face { font-family: "Bowlby One"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/bowlby-one-400.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/figtree-400.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/figtree-600.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/figtree-700.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 800; font-style: normal; font-display: swap; src: url("fonts/figtree-800.woff2") format("woff2"); }
/* Layout: one-screen party app, a single column of "carte" passed hand to hand; dark by choice (played in a circle, often at night) */
:root {
  --ink: #16111c;          /* fondo */
  --felt: #221a2b;         /* superfici */
  --felt-2: #2e2439;       /* superfici rialzate */
  --chalk: #f3ecf7;        /* testo */
  --dust: #a99bb5;         /* testo secondario */
  --signal: #ff3b4e;       /* impostore / azione */
  --signal-deep: #8f0f2a;
  --crew: #4b6bff;         /* civili */
  --crew-deep: #22178f;
  --line: #3a2f47;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--ink); }
body { margin: 0; overscroll-behavior: none; }
body {
  background: var(--ink);
  color: var(--chalk);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
input { font: inherit; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; padding-inline: 18px; padding-block: 18px 24px; display: flex; flex-direction: column; }
.screen { display: flex; flex-direction: column; gap: 18px; flex: 1; }

/* Testata */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 10vw, 2.6rem); line-height: 1; margin: 0; letter-spacing: .01em; }
.brand h1 span { color: var(--signal); }
.brand small { color: var(--dust); font-size: .8rem; }

/* Blocchi impostazioni */
.block { background: var(--felt); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dust); }
.count { font-variant-numeric: tabular-nums; color: var(--dust); font-size: .85rem; }
.note { color: var(--dust); font-size: .82rem; line-height: 1.4; margin: 0; }

.players { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; align-items: center; gap: 10px; background: var(--felt-2); border-radius: 12px; padding: 4px 6px 4px 12px; }
.player .num { font-family: var(--display); color: var(--dust); width: 1.4em; font-variant-numeric: tabular-nums; }
.player input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--chalk); padding: 10px 0; font-size: 1rem; font-weight: 600; -webkit-user-select: text; user-select: text; }
.player input:focus { outline: none; }
.player:focus-within { box-shadow: 0 0 0 2px var(--crew); }
.icon-btn { border: 0; background: transparent; color: var(--dust); width: 38px; height: 38px; border-radius: 10px; font-size: 1.3rem; cursor: pointer; }
.icon-btn:disabled { opacity: .25; }
.add { border: 1.5px dashed var(--line); background: transparent; color: var(--dust); border-radius: 12px; padding: 12px; font-weight: 600; cursor: pointer; }

.stepper { display: flex; align-items: center; justify-content: space-between; }
.stepper .ctrl { display: flex; align-items: center; gap: 14px; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--felt-2); font-size: 1.4rem; font-weight: 700; cursor: pointer; }
.round:disabled { opacity: .3; }
.big { font-family: var(--display); font-size: 2rem; color: var(--signal); width: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.toggle-row strong { display: block; font-weight: 700; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--felt-2); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--chalk); transition: transform .2s; }
.switch input:checked + span { background: var(--signal); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { box-shadow: 0 0 0 2px var(--crew); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--dust); border-radius: 99px; padding: 8px 13px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chalk); color: var(--ink); border-color: var(--chalk); }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg .chip { padding: 9px 0; text-align: center; }

/* Pulsanti principali */
.cta { border: 0; border-radius: 16px; padding: 18px; font-weight: 800; font-size: 1.05rem; background: var(--signal); color: #fff; cursor: pointer; width: 100%; }
.cta:disabled { opacity: .35; }
.cta.ghost { background: var(--felt-2); color: var(--chalk); }
.cta:focus-visible, .chip:focus-visible, .round:focus-visible, .add:focus-visible, .icon-btn:focus-visible, .link:focus-visible { outline: 2px solid var(--crew); outline-offset: 2px; }
.sticky { position: sticky; bottom: 0; padding-block: 12px 4px; background: linear-gradient(to top, var(--ink) 70%, transparent); }
.link { border: 0; background: transparent; color: var(--dust); font-weight: 600; cursor: pointer; padding: 6px 0; }

details.how { color: var(--dust); font-size: .85rem; line-height: 1.5; }
details.how summary { cursor: pointer; font-weight: 600; }
details.how ol { padding-left: 1.2em; margin: 8px 0 0; }

/* Carte */
.topbar { display: flex; justify-content: space-between; align-items: center; }
.progress { font-variant-numeric: tabular-nums; color: var(--dust); font-weight: 600; }
.stage { flex: 1; display: flex; align-items: center; }
.card { width: 100%; min-height: 380px; border-radius: 28px; padding: 30px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.card.pass { background: var(--felt); border: 1.5px solid var(--line); }
.card.crew { background: linear-gradient(150deg, var(--crew), var(--crew-deep)); }
.card.imp { background: linear-gradient(150deg, var(--signal), var(--signal-deep)); }
.card .kicker { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.card .name, .card .word, .starter, .secret, .imp-title { display: block; width: 100%; white-space: nowrap; line-height: 1.08; }
.fit-wrap { white-space: normal !important; text-wrap: balance; }
.card .name { font-family: var(--display); }
.card .word { font-family: var(--display); color: #fff; }
.imp-title { font-family: var(--display); color: #fff; letter-spacing: .01em; }
.card .sub { color: var(--dust); font-size: .9rem; }
.card.crew .sub, .card.imp .sub { color: rgba(255,255,255,.82); }
.hintbox { background: rgba(0,0,0,.25); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
.hintbox b { font-size: 1.6rem; font-weight: 800; color: #fff; line-height: 1.15; text-wrap: balance; }
.tag { display: inline-block; border-radius: 99px; padding: 6px 12px; background: rgba(0,0,0,.22); font-size: .85rem; font-weight: 600; color: #fff; }
.card.pass .tag { background: var(--felt-2); color: var(--dust); }
.mask { width: 104px; height: 97px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
.pop { animation: pop .32s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { transform: scale(.92) rotateY(25deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Discussione */
.center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.h2 { font-family: var(--display); font-size: 2rem; margin: 0; font-weight: 400; }
.starter { font-family: var(--display); color: var(--signal); }
.clock { font-family: var(--display); font-size: 4.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
.clock.low { color: var(--signal); }
.row { display: flex; gap: 10px; justify-content: center; }
.row .cta { width: auto; padding: 12px 22px; font-size: .95rem; }

.confirm { background: var(--felt); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; font-weight: 700; text-align: center; }

/* Risultato */
.reveal-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.imp-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; background: var(--felt); border-radius: 14px; padding: 14px 16px; }
.imp-row b { font-size: 1.25rem; overflow-wrap: anywhere; min-width: 0; }
.imp-row span { color: var(--dust); font-size: .85rem; }
.secret { font-family: var(--display); color: #8fa3ff; }


/* Intro all'avvio */
#intro { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--ink); overflow: hidden; cursor: pointer; }
#intro .glow { position: absolute; width: 140vmax; height: 140vmax; border-radius: 50%; background: radial-gradient(circle, rgba(255,59,78,.55) 0%, rgba(143,15,42,.35) 22%, transparent 48%); transform: scale(0); animation: introGlow 1s .05s cubic-bezier(.2,.8,.2,1) forwards; }
#intro .stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-inline: 16px; }
#intro .hog { width: min(46vw, 210px); height: auto; overflow: visible; transform: scale(.2) rotate(-14deg); opacity: 0; animation: introPop .7s .15s cubic-bezier(.3,1.6,.5,1) forwards; filter: drop-shadow(0 14px 22px rgba(0,0,0,.45)); }
#intro .shades { transform: translateY(-70px); opacity: 0; animation: introShades .5s .85s cubic-bezier(.3,1.5,.5,1) forwards; }
#intro .glint { opacity: 0; animation: introGlint .5s 1.35s ease-out forwards; }
#intro .wordmark { font-family: var(--display); font-size: clamp(2.6rem, 13vw, 4rem); line-height: 1; letter-spacing: .02em; white-space: nowrap; display: flex; }
#intro .wordmark span { display: inline-block; opacity: 0; transform: translateY(.5em) scale(.6); animation: introLetter .38s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(1.45s + var(--i) * 55ms); }
#intro .wordmark .s { color: var(--signal); }
#intro .tag { color: var(--dust); font-weight: 700; font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; opacity: 0; animation: introFade .5s 2.05s ease forwards; }
#intro.out { animation: introOut .45s ease forwards; pointer-events: none; }
@keyframes introGlow { to { transform: scale(1); } }
@keyframes introPop { to { transform: none; opacity: 1; } }
@keyframes introShades { to { transform: none; opacity: 1; } }
@keyframes introGlint { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: .45; } }
@keyframes introLetter { to { opacity: 1; transform: none; } }
@keyframes introFade { to { opacity: 1; } }
@keyframes introOut { to { opacity: 0; transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) {
  #intro .glow, #intro .hog, #intro .shades, #intro .glint, #intro .wordmark span, #intro .tag { animation: none; transform: none; opacity: 1; }
}

@media (prefers-reduced-motion: reduce) { .pop { animation: none; } * { transition: none !important; } }

/* Nuove modalità */
:root { --acc: #8b5cf6; --acc-deep: #3b1a8f; --jes: #f59e0b; --jes-deep: #9a3412; --ok: #2fbf71; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg3 .chip, .seg2 .chip { padding: 10px 4px; text-align: center; }
.seg2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.toggle-row.off { opacity: .45; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); padding-top: 12px; }
.chip.custom { display: inline-flex; align-items: center; gap: 6px; }
.chip .edit { font-size: .8rem; opacity: .7; }
.chip.dashed { border-style: dashed; }
.linkrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card.acc { background: linear-gradient(150deg, var(--acc), var(--acc-deep)); }
.card.jes { background: linear-gradient(150deg, var(--jes), var(--jes-deep)); }
.card.acc .sub, .card.jes .sub { color: rgba(255,255,255,.85); }
.question { font-size: 1.45rem; font-weight: 800; line-height: 1.25; color: #fff; text-wrap: balance; max-width: 22ch; }
.infobox { background: rgba(0,0,0,.25); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.infobox .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.infobox .row span { color: rgba(255,255,255,.75); font-size: .85rem; }
.infobox .row b { color: #fff; font-size: 1.05rem; text-align: right; overflow-wrap: anywhere; }
.round-pill { display: inline-block; border-radius: 99px; padding: 5px 12px; background: var(--felt-2); color: var(--dust); font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.opt { border: 1.5px solid transparent; background: var(--felt-2); color: var(--chalk); border-radius: 14px; padding: 15px 16px; font-weight: 700; font-size: 1.05rem; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:focus-visible { outline: 2px solid var(--crew); outline-offset: 2px; }
.opt.right { background: color-mix(in srgb, var(--ok) 25%, var(--felt-2)); border-color: var(--ok); }
.opt.wrong { background: color-mix(in srgb, var(--signal) 22%, var(--felt-2)); border-color: var(--signal); }
.opt.ghosted { opacity: .4; }
.opt small { color: var(--dust); font-weight: 600; font-size: .8rem; }
.rchip { display: inline-block; border-radius: 99px; padding: 3px 10px; font-size: .75rem; font-weight: 800; letter-spacing: .04em; color: #fff; white-space: nowrap; }
.rchip.civ { background: var(--crew); }
.rchip.imp { background: var(--signal); }
.rchip.acc { background: var(--acc); }
.rchip.jes { background: var(--jes); color: #2a1503; }
.verdict { border-radius: 22px; padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.verdict.civ { background: linear-gradient(150deg, var(--crew), var(--crew-deep)); }
.verdict.imp { background: linear-gradient(150deg, var(--signal), var(--signal-deep)); }
.verdict.jes { background: linear-gradient(150deg, var(--jes), var(--jes-deep)); }
.verdict.none { background: var(--felt); }
.verdict .kicker { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.85); }
.verdict .big-name { font-family: var(--display); color: #fff; display: block; width: 100%; white-space: nowrap; line-height: 1.08; }
.verdict p { margin: 0; color: rgba(255,255,255,.9); font-weight: 600; }
.verdict.none p { color: var(--dust); }
.tally { display: flex; flex-direction: column; gap: 6px; }
.tally .bar { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr auto; gap: 10px; align-items: center; font-size: .9rem; }
.tally .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tally .track { height: 8px; border-radius: 99px; background: var(--felt-2); overflow: hidden; }
.tally .track i { display: block; height: 100%; background: var(--signal); border-radius: 99px; }
.tally .bar b { font-variant-numeric: tabular-nums; color: var(--dust); }
.people { display: flex; flex-direction: column; gap: 6px; }
.person { display: flex; align-items: center; gap: 10px; background: var(--felt); border-radius: 12px; padding: 11px 14px; }
.person .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person.out .nm { text-decoration: line-through; text-decoration-color: var(--dust); color: var(--dust); }
.person .pts { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ok); min-width: 2.2em; text-align: right; }
.person .pts.zero { color: var(--dust); font-weight: 600; }
.words-recap { background: var(--felt); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.words-recap .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.words-recap .row span { color: var(--dust); font-size: .85rem; }
.words-recap .row b { font-size: 1.05rem; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.words-recap .q { font-weight: 700; line-height: 1.35; }
.board { display: flex; flex-direction: column; gap: 6px; }
.board .person .rank { font-family: var(--display); color: var(--dust); width: 1.6em; font-variant-numeric: tabular-nums; }
.board .person.first .rank { color: var(--jes); }
.board .person .pts { color: var(--chalk); font-size: 1.1rem; }
.empty { color: var(--dust); text-align: center; padding: 24px 8px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field textarea { background: var(--felt-2); border: 1.5px solid transparent; color: var(--chalk); border-radius: 12px; padding: 12px; font-size: 1rem; -webkit-user-select: text; user-select: text; width: 100%; }
.field textarea { min-height: 14em; resize: vertical; line-height: 1.45; font-family: var(--body); }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--crew); }
.err { color: var(--signal); font-weight: 700; font-size: .9rem; margin: 0; }
.inline-confirm { background: var(--felt-2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.inline-confirm p { margin: 0; font-weight: 700; text-align: center; }
.turn-ring { --p: 1; width: 210px; height: 210px; max-width: 70vw; max-height: 70vw; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--signal) calc(var(--p) * 360deg), var(--felt-2) 0); transition: background .2s linear; }
.turn-ring > div { width: 84%; height: 84%; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.turn-ring b { font-family: var(--display); font-size: 4.2rem; font-variant-numeric: tabular-nums; }
.turn-next { color: var(--dust); font-size: .9rem; }
.stack-gap { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

<div id="intro" role="img" aria-label="Impostore">
  <div class="glow"></div>
  <div class="stack">
    <svg class="hog" viewBox="0 0 120 112" fill="none" aria-hidden="true">
      <path d="M24 32 9 8l28 15Z" fill="#4a3d38"/><path d="M96 32 111 8 83 23Z" fill="#4a3d38"/>
      <path d="M24 28 15 14l15 9Z" fill="#b98a80"/><path d="M96 28l9-14-15 9Z" fill="#b98a80"/>
      <path d="M23 26Q60 6 97 26q8 26-5 46H28Q15 52 23 26Z" fill="#7d6c63"/>
      <circle cx="24" cy="66" r="6" fill="#7d6c63"/><circle cx="96" cy="66" r="6" fill="#7d6c63"/>
      <circle cx="39" cy="52" r="4" fill="#2c211e"/><circle cx="81" cy="52" r="4" fill="#2c211e"/>
      <circle cx="40.3" cy="50.7" r="1.3" fill="#fff"/><circle cx="82.3" cy="50.7" r="1.3" fill="#fff"/>
      <ellipse cx="60" cy="82" rx="31" ry="23" fill="#93807a"/>
      <circle cx="31" cy="80" r="4.5" fill="#93807a"/><circle cx="89" cy="80" r="4.5" fill="#93807a"/>
      <path d="M39 94Q25 92 22 72q8 13 21 15Z" fill="#f3ebde"/><path d="M81 94q14-2 17-22-8 13-21 15Z" fill="#f3ebde"/>
      <ellipse cx="60" cy="92" rx="17" ry="11" fill="#d39c91"/>
      <ellipse cx="53" cy="92" rx="3.6" ry="5" fill="#2c211e"/><ellipse cx="67" cy="92" rx="3.6" ry="5" fill="#2c211e"/>
      <path d="M49 105q11 4 22-1" stroke="#2c211e" stroke-width="2.6" stroke-linecap="round"/>
      <g class="shades">

          <button class="round" id="impMinus" aria-label="Meno impostori" ${settings.impostors <= 1 ? "disabled" : ""}>−</button>

          <button class="round" id="impPlus" aria-label="Più impostori" ${settings.impostors >= m ? "disabled" : ""}>+</button>
        </div>
      </div>
      ${mode === "classic" ? toggleRow("hint", "Parola indizio", "L'impostore riceve una parola collegata a quella segreta.", settings.hint) : ""}
      ${toggleRow("acc", "Complice", accNote, settings.accomplice, !room.one)}
      ${toggleRow("jes", "Giullare", jesNote, settings.jester, jesDisabled && !settings.jester)}
    </div>

    <div class="block">
      <span class="label">Votazione</span>
      <div class="seg2">
        <button class="chip" data-vote="voce" aria-pressed="${settings.vote === "voce"}">A voce</button>
        <button class="chip" data-vote="segreto" aria-pressed="${settings.vote === "segreto"}">Segreta in app</button>
      </div>
      <p class="note">${settings.vote === "voce" ? "Votate a voce e indicate nell'app chi ha preso più voti." : "Il telefono passa di mano e ognuno vota in segreto. Chi vota un impostore guadagna 1 punto."}</p>
      ${toggleRow("rounds", "Eliminazione a manche", "Si continua a giocare finché gli impostori sono tutti fuori o diventano la maggioranza.", settings.rounds)}
      ${mode === "classic" ? toggleRow("last", "Ultima chance", "L'impostore eliminato può indovinare la parola tra 4 opzioni e rubare la vittoria.", settings.lastChance) : ""}
    </div>

    ${mode !== "questions" ? `
    <div class="block">
      <div class="block-head"><span class="label">Categorie</span><button class="link" id="allCats">${settings.cats.length >= BUILTIN.length + customs.length ? "Deseleziona tutte" : "Seleziona tutte"}</button></div>
      <div class="chips">
        ${BUILTIN.map(c => `<button class="chip" data-cat="${esc(c.key)}" aria-pressed="${settings.cats.includes(c.key)}">${c.emoji} ${esc(c.name)}</button>`).join("")}
        ${customs.map(c => `<button class="chip custom" data-cat="${esc(c.key)}" aria-pressed="${settings.cats.includes(c.key)}">⭐ ${esc(c.name)} <span class="edit" data-edit="${esc(c.id)}" role="button" aria-label="Modifica ${esc(c.name)}">✎</span></button>`).join("")}
        <button class="chip dashed" id="newCat">+ Crea categoria</button>
      </div>

    <div class="block">
      <span class="label">Timer discussione</span>
      <div class="seg">
        ${[0, 1, 2, 3, 5].map(t => `<button class="chip" data-timer="${t}" aria-pressed="${settings.timer === t}">${t ? t + " min" : "No"}</button>`).join("")}
      </div>
      <span class="label" style="margin-top:4px">Turni a tempo</span>
      <div class="seg">
        ${[0, 5, 10, 15, 20].map(t => `<button class="chip" data-turn="${t}" aria-pressed="${settings.turnSecs === t}">${t ? t + " s" : "No"}</button>`).join("")}
      </div>
      <p class="note">Modalità lampo: ognuno ha pochi secondi per dire la sua parola, a turno.</p>
    </div>

    <div class="linkrow">
      <button class="link" id="openScores">🏆 Classifica</button>
      <details class="how">
        <summary>Come si gioca</summary>
        <ol>
          <li>Il telefono passa di mano: ognuno vede in segreto il suo ruolo.</li>
          <li>A turno, ognuno dice una parola collegata (o risponde alla domanda). Poi si vota.</li>
          <li>I civili vincono se eliminano l'impostore. L'impostore vince se resta in gioco.</li>
          <li>Punti: civili vincitori +1, impostori e complice +2, giullare +3, ultima chance indovinata +1.</li>
        </ol>
      </details>
    </div>

    <div class="sticky"><button class="cta" id="start" ${canStart() ? "" : "disabled"}>Inizia partita</button></div>
  </section>`;

  $app.querySelectorAll(".player input").forEach(inp => inp.addEventListener("input", e => {
    settings.players[+e.target.dataset.i] = e.target.value; save();
    document.getElementById("start").disabled = !canStart();
    const dup = new Set(settings.players.map(p => p.trim().toLowerCase())).size !== settings.players.length;
    document.getElementById("dupErr").hidden = !dup;
  }));
  $app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { settings.players.splice(+b.dataset.del, 1); clamp(); save(); render(); });
  on("add", () => {
    let n = settings.players.length + 1;
    while (settings.players.some(p => p.trim().toLowerCase() === ("giocatore " + n))) n++;
    settings.players.push("Giocatore " + n); clamp(); save(); render();
    const last = document.getElementById("p" + (settings.players.length - 1));
    if (last) { last.focus(); last.select(); last.scrollIntoView({ block: "center" }); }
  });
  $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { settings.mode = b.dataset.mode; save(); render(); });
  on("impMinus", () => { settings.impostors--; clamp(); save(); render(); });
  on("impPlus", () => { settings.impostors++; clamp(); save(); render(); });
  const bindToggle = (id, key) => { const el = document.getElementById(id); if (el) el.onchange = e => { settings[key] = e.target.checked; clamp(); save(); render(); }; };
  bindToggle("hint", "hint"); bindToggle("acc", "accomplice"); bindToggle("jes", "jester"); bindToggle("rounds", "rounds"); bindToggle("last", "lastChance");
  $app.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => { settings.vote = b.dataset.vote; save(); render(); });
  $app.querySelectorAll("[data-cat]").forEach(b => b.onclick = e => {
    if (e.target.dataset.edit) { openEditor(e.target.dataset.edit); return; }
    const n = b.dataset.cat;
    settings.cats = settings.cats.includes(n) ? settings.cats.filter(x => x !== n) : [...settings.cats, n];
    save(); render();
  });
  on("allCats", () => {
    const keys = BUILTIN.map(c => c.key).concat(customCats().filter(c => c.words.length >= 4).map(c => c.key));
    settings.cats = settings.cats.length >= keys.length ? [] : keys; save(); render();
  });
  on("newCat", () => openEditor(null));
  $app.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => { settings.timer = +b.dataset.timer; save(); render(); });
  $app.querySelectorAll("[data-turn]").forEach(b => b.onclick = () => { settings.turnSecs = +b.dataset.turn; save(); render(); });
  on("openScores", () => { prevPhase = "setup"; confirmReset = false; phase = "scores"; render(); });
  on("start", startRound);
}

/* ---------- Categorie personalizzate ---------- */
function openEditor(id) {
  const c = id && settings.custom.find(x => String(x.id) === String(id));
  editCat = c ? { id: c.id, name: c.name, text: c.text, isNew: false } : { id: Date.now().toString(36), name: "", text: "", isNew: true };
  confirmDelete = false; editCat.err = ""; phase = "editCat"; render();
}
function renderEditCat() {
  const count = parseCustom(editCat).words.length;
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="back">← Indietro</button><span class="progress">${editCat.isNew ? "Nuova categoria" : "Modifica categoria"}</span></div>
    <div class="field"><label class="label" for="catName">Nome</label><input id="catName" maxlength="24" value="${esc(editCat.name)}" placeholder="Es. Il nostro paese" autocomplete="off"></div>
    <div class="field">
      <label class="label" for="catText">Parole · <span id="wcount">${count}</span> inserite</label>
      <textarea id="catText" placeholder="Una parola per riga. Gli indizi sono facoltativi:&#10;&#10;Bar Sport: Caffè, Biliardo, Partita&#10;Piazza: Fontana, Mercato&#10;Oratorio">${esc(editCat.text)}</textarea>
      <p class="note">Una parola per riga, almeno 4. Per aggiungere indizi scrivi la parola, i due punti e gli indizi separati da virgole.</p>
    </div>
    <p class="err" ${editCat.err ? "" : "hidden"}>${esc(editCat.err)}</p>
    <div style="flex:1"></div>
    ${!editCat.isNew ? (confirmDelete ? `
      <div class="inline-confirm"><p>Eliminare "${esc(editCat.name)}"?</p>
        <button class="cta" id="delYes">Sì, elimina</button><button class="cta ghost" id="delNo">Annulla</button></div>`
      : `<button class="link" id="del" style="color:var(--signal)">Elimina categoria</button>`) : ""}
    <button class="cta" id="saveCat">Salva categoria</button>
  </section>`;
  const nameEl = document.getElementById("catName"), textEl = document.getElementById("catText");
  nameEl.addEventListener("input", () => editCat.name = nameEl.value);
  textEl.addEventListener("input", () => { editCat.text = textEl.value; document.getElementById("wcount").textContent = parseCustom(editCat).words.length; });
  on("back", goSetup);
  on("del", () => { confirmDelete = true; render(); });
  on("delNo", () => { confirmDelete = false; render(); });
  on("delYes", () => {
    settings.custom = settings.custom.filter(x => String(x.id) !== String(editCat.id));
    settings.cats = settings.cats.filter(k => k !== "custom:" + editCat.id);
    save(); goSetup();
  });
  on("saveCat", () => {
    const name = editCat.name.trim();
    if (!name) { editCat.err = "Dai un nome alla categoria."; render(); return; }
    if (parseCustom(editCat).words.length < 4) { editCat.err = "Servono almeno 4 parole diverse."; render(); return; }
    const data = { id: editCat.id, name, text: editCat.text };
    const i = settings.custom.findIndex(x => String(x.id) === String(editCat.id));
    if (i >= 0) settings.custom[i] = data; else { settings.custom.push(data); settings.cats.push("custom:" + data.id); }
    save(); goSetup();
  });
}

/* ---------- Distribuzione ruoli ---------- */
function cardFor(r) {
  const g = game, mode = g.mode;
  const catTag = g.cat ? `<span class="tag">${g.cat.emoji} ${esc(g.cat.name)}</span>` : "";
  const impNames = g.roles.filter(x => x.role === "imp").map(x => esc(x.name)).join(", ");
  const nImp = g.roles.filter(x => x.role === "imp").length;
  const secretRow = mode === "questions"
    ? `<div class="row"><span>Domanda dei civili</span></div><div class="question" style="font-size:1.05rem;max-width:none">${esc(g.content.civ)}</div>`
    : `<div class="row"><span>${mode === "undercover" ? "Parola dei civili" : "Parola segreta"}</span><b>${esc(g.content.civ)}</b></div>`;

  if (r.role === "acc") {
    return `<div class="card acc pop">
      <span class="kicker">Sei il</span>
      <div class="imp-title" data-fit="34,18">Complice</div>
      <div class="infobox">${secretRow}<div class="row"><span>${nImp === 1 ? (mode === "undercover" ? "L'undercover" : "L'impostore") : (mode === "undercover" ? "Gli undercover" : "Gli impostori")}</span><b>${impNames}</b></div></div>
      <span class="sub">Vinci se ${impWord(nImp, mode)} ${nImp === 1 ? "vince" : "vincono"}. ${mode === "classic" ? "Aiuta" : "Proteggi"} senza farti scoprire.</span>
      ${catTag}
    </div>`;
  }
  if (r.role === "jes") {
    return `<div class="card jes pop">
      <span class="kicker">Sei il</span>
      <div class="imp-title" data-fit="34,18">Giullare</div>
      <div class="infobox">${secretRow}</div>
      <span class="sub">Vinci da solo se il gruppo ti elimina. Comportati in modo sospetto, ma senza esagerare.</span>
      ${catTag}
    </div>`;
  }
  if (mode === "questions") {
    const q = r.role === "imp" ? g.content.imp : g.content.civ;
    return `<div class="card crew pop">
      <span class="kicker">La tua domanda</span>
      <div class="question">${esc(q)}</div>
      <span class="sub">Pensa alla risposta e tienila per te: la direte a turno.</span>
    </div>`;
  }
  if (mode === "undercover") {
    const w = r.role === "imp" ? g.content.imp : g.content.civ;
    return `<div class="card crew pop">
      <span class="kicker">La tua parola è</span>
      <div class="word" data-fit="52,24">${esc(w)}</div>
      <span class="sub">Attento: qualcuno potrebbe avere una parola diversa.</span>
      ${catTag}
    </div>`;
  }
  if (r.role === "imp") {
    return `<div class="card imp pop">
      ${MASK}
      <div class="imp-title" data-fit="30,18">Sei l'impostore</div>
      ${r.hint
        ? `<div class="hintbox"><span class="sub">Il tuo indizio</span><b>${esc(r.hint)}</b></div><span class="sub">Usalo per intuire la parola senza farti scoprire</span>`
        : `<span class="sub">Non conosci la parola: ascolta e bluffa</span>`}
      ${catTag}
    </div>`;
  }
  return `<div class="card crew pop">
    <span class="kicker">La parola segreta è</span>
    <div class="word" data-fit="52,24">${esc(g.content.civ)}</div>
    ${catTag}
  </div>`;
}
function renderReveal() {
  const r = game.roles[game.idx];
  const last = game.idx === game.roles.length - 1;
  const card = showing ? cardFor(r) : `<div class="card pass">
      <span class="kicker">Passa il telefono a</span>
      <div class="name" data-fit="44,22">${esc(r.name)}</div>
      <span class="sub">Nessun altro deve guardare lo schermo</span>
    </div>`;
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="quit">← Esci</button><span class="progress">${game.idx + 1} di ${game.roles.length}</span></div>
    <div class="stage">${card}</div>
    <button class="cta ${showing ? "ghost" : ""}" id="next">${showing ? (last ? "Ho visto · inizia la discussione" : "Ho visto · nascondi e passa") : "Tocca per vedere il tuo ruolo"}</button>
  </section>`;
  on("quit", goSetup);
  on("next", () => {
    if (!showing) { showing = true; buzz(30); render(); return; }
    showing = false;
    if (last) enterDiscussion(); else { game.idx++; render(); }
  });
}

/* ---------- Discussione ---------- */
function renderDiscussion() {
  const g = game;
  const aliveN = aliveIdx().length;
  const instr = g.mode === "questions"
    ? "A turno, ognuno risponde ad alta voce alla sua domanda, senza dirla. Poi votate chi aveva una domanda diversa."
    : "A turno, ognuno dice una parola collegata alla sua. Poi votate chi pensate sia l'impostore.";
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="quit">← Esci</button><span class="progress">${g.cat ? g.cat.emoji + " " + esc(g.cat.name) : "❓ Domande"}</span></div>
    <div class="center" style="margin-top:4px">
      ${settings.rounds ? `<span class="round-pill">Giro ${g.round} · ${aliveN} in gioco</span>` : ""}
      <h2 class="h2">Discussione</h2>
      <span class="note">Inizia</span>
      <div class="starter" data-fit="38,22">${esc(g.roles[g.starter].name)}</div>
      <p class="note" style="max-width:34ch;margin-top:8px">${instr}</p>
      ${notice ? `<p class="note" style="color:var(--ok);font-weight:700">${esc(notice)}</p>` : ""}
    </div>
    ${settings.turnSecs ? `<button class="cta ghost" id="turns">⚡ Giro lampo · ${settings.turnSecs} secondi a testa</button>` : ""}
    ${settings.timer ? `
    <div class="center">
      <div class="clock" id="clock" aria-live="off"></div>
      <div class="row">
        <button class="cta" id="timerBtn"></button>
        <button class="cta ghost" id="reset">Reset</button>
      </div>
    </div>` : ""}
    <div style="flex:1"></div>
    <button class="cta" id="toVote">${settings.vote === "segreto" ? "Vota in segreto" : "Andate al voto"}</button>
  </section>`;
  on("quit", goSetup);
  on("turns", () => { notice = ""; startTurns(); });
  if (settings.timer) {
    renderClock();
    on("timerBtn", () => { running ? stopTimer() : startTimer(); renderClock(); });
    on("reset", () => { stopTimer(); remaining = settings.timer * 60; renderClock(); });
  }
  on("toVote", () => { notice = ""; startVote(); });
}
function renderTurns() {
  const cur = game.roles[turn.order[turn.i]];
  const nxt = turn.order[turn.i + 1] !== undefined ? game.roles[turn.order[turn.i + 1]].name : null;
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="stopT">← Interrompi</button><span class="progress">${turn.i + 1} di ${turn.order.length}</span></div>
    <div class="center" style="flex:1;justify-content:center;gap:18px">
      <span class="label">Tocca a</span>
      <div class="starter" data-fit="44,22">${esc(cur.name)}</div>
      <div class="turn-ring" id="turnRing" style="--p:${turn.left / settings.turnSecs}"><div><b id="turnLeft">${turn.left}</b></div></div>
      <span class="turn-next">${nxt ? "Poi: " + esc(nxt) : "Ultimo turno"}</span>
    </div>
    <button class="cta" id="skipT">${nxt ? "Fatto · prossimo" : "Fatto · fine giro"}</button>
  </section>`;
  on("stopT", () => { stopTurns(); turn = null; enterDiscussion(); });
  on("skipT", nextTurn);
}

/* ---------- Schermate voto ---------- */
function renderVoteOpen() {
  const alive = aliveIdx();
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="back">← Discussione</button>${settings.rounds ? `<span class="round-pill">Giro ${game.round}</span>` : ""}</div>
    <div class="center"><h2 class="h2">Votazione</h2><p class="note" style="max-width:32ch">Votate a voce, poi toccate chi ha preso più voti.</p></div>
    <div class="opts">
      ${alive.map(i => `<button class="opt" data-out="${i}">${esc(game.roles[i].name)}</button>`).join("")}
    </div>
    <button class="cta ghost" id="none">Pareggio · nessuno eliminato</button>
  </section>`;
  on("back", enterDiscussion);
  $app.querySelectorAll("[data-out]").forEach(b => b.onclick = () => eliminate(+b.dataset.out, null));
  on("none", () => eliminate(null, null));
}
function renderVote() {
  const voter = vote.voters[vote.i];
  const name = game.roles[voter].name;
  let body;
  if (!vote.showing) {
    body = `<div class="stage"><div class="card pass">
      <span class="kicker">${vote.ballot ? "Ballottaggio · passa a" : "Voto segreto · passa a"}</span>
      <div class="name" data-fit="44,22">${esc(name)}</div>
      <span class="sub">Nessun altro deve guardare lo schermo</span>
    </div></div>
    <button class="cta" id="openVote">Tocca per votare</button>`;
  } else {
    const opts = vote.candidates.filter(c => c !== voter);
    body = `<div class="center"><span class="label">${esc(name)}, chi è l'impostore?</span></div>
    <div class="opts" style="margin-top:4px">${opts.map(c => `<button class="opt" data-vote="${c}">${esc(game.roles[c].name)}</button>`).join("")}</div>
    <div style="flex:1"></div>`;
  }
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="back">← Discussione</button><span class="progress">Voto ${vote.i + 1} di ${vote.voters.length}</span></div>
    ${body}
  </section>`;
  on("back", enterDiscussion);
  on("openVote", () => { vote.showing = true; buzz(30); render(); });
  $app.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => {
    vote.votes[voter] = +b.dataset.vote; vote.showing = false; vote.i++; buzz(30);
    if (vote.i >= vote.voters.length) finishSecretVote(); else render();
  });
}
function tallyHtml(t) {
  if (!t) return "";
  const entries = Object.entries(t.counts).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="tally">${entries.map(([i, n]) => `<div class="bar"><span>${esc(game.roles[i].name)}</span><span class="track"><i style="width:${n / max * 100}%"></i></span><b>${n}</b></div>`).join("")}</div>`;
}
function renderVoteTie() {
  const t = vote.tie;
  $app.innerHTML = `
  <section class="screen">
    <div style="flex:1"></div>
    <div class="verdict none"><span class="kicker" style="color:var(--dust)">Pareggio</span>
      <p>${t.leaders.map(i => esc(game.roles[i].name)).join(" e ")} hanno ${t.max} ${plural(t.max, "voto", "voti")} a testa.</p></div>
    ${tallyHtml(t)}
    <p class="note" style="text-align:center">Ballottaggio: votate di nuovo, solo tra loro. Se c'è ancora pareggio, nessuno viene eliminato.</p>
    <div style="flex:1"></div>
    <button class="cta" id="ballot">Inizia il ballottaggio</button>
  </section>`;
  on("ballot", () => startVote(t.leaders, 1));
}

/* ---------- Eliminazione ---------- */
function renderElimination() {
  const g = game, out = g.last.out;
  const r = out !== null ? g.roles[out] : null;
  const lc = r && needsLastChance();
  const res = lc ? null : outcome();
  let verdict;
  if (!r) {
    verdict = `<div class="verdict none"><span class="kicker" style="color:var(--dust)">Pareggio</span><p>Nessuno viene eliminato in questo giro.</p></div>`;
  } else {
    const cls = r.role === "civ" ? "civ" : r.role === "jes" ? "jes" : "imp";
    const what = r.role === "civ" ? `Era un civile.` : r.role === "imp" ? `Era ${g.mode === "undercover" ? "l'undercover" : "l'impostore"}!` : r.role === "acc" ? "Era il complice!" : "Era il giullare!";
    const extra = r.role === "imp" && g.mode === "undercover" ? `<p>La sua parola era <b>${esc(g.content.imp)}</b>.</p>` : r.role === "imp" && g.mode === "questions" ? `<p>La sua domanda era diversa.</p>` : "";
    verdict = `<div class="verdict ${cls}"><span class="kicker">Eliminato</span><div class="big-name" data-fit="40,22">${esc(r.name)}</div><p>${what}</p>${extra}</div>`;
  }
  let btn;
  if (lc) btn = `<button class="cta" id="toLast">Ultima chance per ${esc(r.name)}</button>`;
  else if (res) btn = `<button class="cta" id="toEnd">Vedi il risultato</button>`;
  else btn = `<button class="cta" id="toNext">Prossimo giro</button>`;
  const remain = !lc && !res ? `<p class="note" style="text-align:center">${(() => { const n = g.roles.filter(x => x.alive && x.role === "imp").length; return `${plural(n, "Resta", "Restano")} ${n} ${g.mode === "undercover" ? plural(n, "undercover", "undercover") : plural(n, "impostore", "impostori")} in gioco.`; })()}</p>` : "";
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><span></span>${settings.rounds ? `<span class="round-pill">Giro ${g.round}</span>` : ""}</div>
    <div style="flex:1"></div>
    ${verdict}
    ${tallyHtml(g.last.tally)}
    ${remain}
    <div style="flex:1"></div>
    ${btn}
  </section>`;
  on("toLast", () => {
    const others = shuffle(g.cat.words.filter(w => w.word !== g.content.civ)).slice(0, 3).map(w => w.word);
    g.lastOpts = shuffle(others.concat(g.content.civ)); lastPick = null;
    phase = "lastChance"; render();
  });
  on("toEnd", () => finish(res));
  on("toNext", nextRound);
}
function renderLastChance() {
  const g = game, r = g.roles[g.last.out];
  const picked = lastPick !== null;
  const correct = picked && g.lastOpts[lastPick] === g.content.civ;
  let after = "";
  if (picked) {
    const res = correct ? "imp" : outcome();
    after = `<div class="verdict ${correct ? "imp" : "civ"}"><span class="kicker">${correct ? "Indovinata!" : "Sbagliato"}</span>
      <p>${correct ? `${esc(r.name)} ha indovinato la parola e ruba la vittoria.` : `La parola era <b>${esc(g.content.civ)}</b>.`}</p></div>
      <button class="cta" id="${res ? "toEnd" : "toNext"}">${res ? "Vedi il risultato" : "Prossimo giro"}</button>`;
    setTimeout(() => {
      on("toEnd", () => { if (correct) g.guesser = r.name; finish(res); });
      on("toNext", nextRound);
    });
  }
  $app.innerHTML = `
  <section class="screen">
    <div class="center" style="margin-top:6px">
      <span class="label">Ultima chance</span>
      <div class="starter" data-fit="38,22">${esc(r.name)}</div>
      <p class="note" style="max-width:32ch">Qual era la parola segreta? Se indovini, vince la tua squadra.</p>
    </div>
    <div class="opts">
      ${g.lastOpts.map((w, i) => {
        let cls = "";
        if (picked) cls = w === g.content.civ ? "right" : (i === lastPick ? "wrong" : "ghosted");
        return `<button class="opt ${cls}" data-pick="${i}" ${picked ? "disabled" : ""}>${esc(w)}</button>`;
      }).join("")}
    </div>
    <div style="flex:1"></div>
    ${after}
  </section>`;
  $app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { lastPick = +b.dataset.pick; buzz(60); render(); });
}

/* ---------- Risultato ---------- */
function renderResult() {
  const g = game, w = g.winner;
  const nImp = g.roles.filter(r => r.role === "imp").length;
  const hasAcc = g.roles.some(r => r.role === "acc");
  const title = w === "civ" ? "Vincono i civili" : w === "jes" ? "Vince il giullare" : (g.mode === "undercover" ? plural(nImp, "Vince l'undercover", "Vincono gli undercover") : plural(nImp, "Vince l'impostore", "Vincono gli impostori"));
  const sub = w === "jes" ? `${esc(g.roles.find(r => r.role === "jes").name)} si è fatto eliminare apposta.`
    : w === "imp" && g.guesser ? `${esc(g.guesser)} ha indovinato all'ultimo.`
    : w === "imp" && hasAcc ? "Insieme al complice." : "";
  const words = g.mode === "questions"
    ? `<div class="row"><span>Domanda dei civili</span></div><div class="q">${esc(g.content.civ)}</div>
       <div class="row" style="margin-top:6px"><span>Domanda dell'impostore</span></div><div class="q">${esc(g.content.imp)}</div>`
    : g.mode === "undercover"
      ? `<div class="row"><span>Parola dei civili</span><b>${esc(g.content.civ)}</b></div><div class="row"><span>Parola dell'undercover</span><b>${esc(g.content.imp)}</b></div>`
      : `<div class="row"><span>Parola segreta</span><b>${esc(g.content.civ)}</b></div>${g.roles.filter(r => r.hint).map(r => `<div class="row"><span>Indizio di ${esc(r.name)}</span><b>${esc(r.hint)}</b></div>`).join("")}`;
  const order = { imp: 0, acc: 1, jes: 2, civ: 3 };
  const people = g.roles.slice().sort((a, b) => order[a.role] - order[b.role]);
  $app.innerHTML = `
  <section class="screen">
    <div class="verdict ${w}"><span class="kicker">Fine partita</span><div class="big-name" data-fit="36,20">${title}</div>${sub ? `<p>${sub}</p>` : ""}</div>
    <div class="words-recap">${words}</div>
    <div class="people">
      ${people.map(r => {
        const p = g.pts[r.name] || 0;
        return `<div class="person ${r.alive ? "" : "out"}"><span class="nm">${esc(r.name)}</span><span class="rchip ${r.role}">${roleLabel(r.role, g.mode)}</span><span class="pts ${p ? "" : "zero"}">${p ? "+" + p : "0"}</span></div>`;
      }).join("")}
    </div>
    <div class="stack-gap">
      <button class="cta" id="again">Nuova partita</button>
      <div class="seg2"><button class="cta ghost" id="board">🏆 Classifica</button><button class="cta ghost" id="setup">Impostazioni</button></div>
    </div>
  </section>`;
  on("again", startRound);
  on("board", () => { prevPhase = "result"; confirmReset = false; phase = "scores"; render(); });
  on("setup", goSetup);
}

/* ---------- Classifica ---------- */
function renderScores() {
  const rows = Object.entries(scores).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const top = rows.length ? rows[0][1] : 0;
  $app.innerHTML = `
  <section class="screen">
    <div class="topbar"><button class="link" id="back">← Indietro</button><span class="progress">Classifica</span></div>
    <h2 class="h2">Classifica</h2>
    ${rows.length ? `<div class="board">${rows.map(([n, p], i) => `<div class="person ${p === top && p > 0 ? "first" : ""}"><span class="rank">${i + 1}</span><span class="nm">${esc(n)}</span><span class="pts">${p}</span></div>`).join("")}</div>`
      : `<p class="empty">Ancora nessun punto.<br>Gioca una partita per iniziare la classifica.</p>`}
    <p class="note">Civili vincitori +1 · impostori e complice +2 · giullare +3 · ultima chance indovinata +1 · con il voto segreto, +1 a chi vota un impostore eliminato.</p>
    <div style="flex:1"></div>
    ${rows.length ? (confirmReset ? `<div class="inline-confirm"><p>Azzerare tutti i punti?</p><button class="cta" id="resetYes">Sì, azzera</button><button class="cta ghost" id="resetNo">Annulla</button></div>`
      : `<button class="cta ghost" id="reset">Azzera classifica</button>`) : ""}
  </section>`;
  on("back", () => { phase = game && prevPhase === "result" ? "result" : "setup"; if (phase === "setup") game = null; render(); });
  on("reset", () => { confirmReset = true; render(); });
  on("resetNo", () => { confirmReset = false; render(); });
  on("resetYes", () => { scores = {}; saveScores(); confirmReset = false; render(); });
}

clamp();
render();

(function () {
  const intro = document.getElementById("intro");
  if (!intro) return;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let done = false;
  const close = () => {
    if (done) return; done = true;
    intro.classList.add("out");
    setTimeout(() => intro.remove(), 460);
  };
  intro.addEventListener("click", close);
  setTimeout(close, reduced ? 1200 : 2900);
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
